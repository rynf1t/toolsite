<!doctype html>
<html lang="en-AU">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<link rel="alternate" type="text/plain" href="%sveltekit.assets%/llms.txt" title="llms.txt" />
		<script>
			// Light or dark before first paint: the reader's choice if they made one, otherwise the system's.
			(function () {
				var q = matchMedia('(prefers-color-scheme: dark)');
				function saved() {
					try { return localStorage.getItem('toolsite-mode'); } catch (e) { return null; }
				}
				function apply() {
					document.documentElement.dataset.mode = saved() || (q.matches ? 'dark' : 'light');
				}
				apply();
				q.addEventListener('change', apply);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
